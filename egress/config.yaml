api_key: devkey
api_secret: secret
ws_url: ws://livekit:7880

# Redis OBLIGATOIRE — Egress s'enregistre ici, LiveKit le découvre via Redis
redis:
  address: redis:6379

# Dossier temporaire pendant l'encodage
tmp_dir: /tmp/egress

# Port de health check (utilisé par le healthcheck Docker)
health_port: 8080

logging:
  level: debug

# S3 Configuration
s3:
  endpoint: http://minio:9000
  access_key: videolog
  secret: videolog123
  region: us-east-1
  bucket: recordings
  force_path_style: true
