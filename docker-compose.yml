# ============================================================
#  VIDEOLOG — Full Stack (version optimisée prod)
#  Configurer .env avec les variables de déploiement
#  Démarrer : docker compose up -d
# ============================================================

x-base: &base
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  videolog:
    driver: bridge

volumes:
  mongo_data:
  minio_data:
  redis_data:
  egress_tmp:
  caddy_data:
  caddy_config:

services:

  # ----------------------------------------------------------
  # 0. CADDY — seul point d'entrée HTTP(S), TLS automatique
  # ----------------------------------------------------------
  caddy:
    <<: *base
    image: caddy:2.8-alpine
    container_name: vl-caddy
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-videolog.app}
      DASHBOARD_AUTH_USER: ${DASHBOARD_AUTH_USER:-videolog}
      DASHBOARD_AUTH_HASH: ${DASHBOARD_AUTH_HASH:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - videolog
    depends_on:
      - dashboard
      - dashboard-api
      - livekit
      - minio
    deploy:
      resources:
        limits:
          memory: 128m

  # ----------------------------------------------------------
  # 1. LIVEKIT SERVER
  # ----------------------------------------------------------
  livekit:
    <<: *base
    image: livekit/livekit-server:v1.7.2
    container_name: vl-livekit
    ports:
      - "127.0.0.1:7880:7880"   # signalisation : via Caddy (wss://livekit.DOMAIN)
      - "7881:7881"             # ICE/TCP fallback (public)
      - "7882:7882/udp"         # média WebRTC (public)
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:?}": "${LIVEKIT_API_SECRET:?}"
        logging:
          level: info
          pion_level: error
        development: false
        room:
          auto_create: true
          max_participants: 20
          empty_timeout: 30
        webhook:
          urls:
            - http://egress-webhook:8088/webhook/livekit
            - http://dashboard-api:8000/webhook/livekit
          api_key: "${LIVEKIT_API_KEY:?}"
    networks:
      - videolog
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  # ----------------------------------------------------------
  # 2. REDIS (réseau interne uniquement)
  # ----------------------------------------------------------
  redis:
    <<: *base
    image: redis:7.2-alpine
    container_name: vl-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save ""
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --aof-use-rdb-preamble no
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

  # ----------------------------------------------------------
  # 3. MONGODB (réseau interne uniquement)
  # ----------------------------------------------------------
  mongo:
    <<: *base
    image: mongo:7.0
    container_name: vl-mongo
    # cache WiredTiger plafonné, sinon Mongo vise ~50% de la RAM de l'hôte
    # et se fait OOM-kill par la limite de 512m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-writer/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-videolog}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER requis dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD requis dans .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER requis dans .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD requis dans .env}
    networks:
      - videolog
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ----------------------------------------------------------
  # 4. MINIO
  # ----------------------------------------------------------
  minio:
    <<: *base
    image: videolog-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio-server
      dockerfile: Dockerfile
    container_name: vl-minio
    ports:
      - "127.0.0.1:9000:9000"   # API S3 : Nginx hôte (ou Caddy) en frontal
      - "127.0.0.1:9001:9001"   # console : accès via tunnel SSH uniquement
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    command: server /data --console-address ":9001"
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    build:
      context: ./minio-init
      dockerfile: Dockerfile
    container_name: vl-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    networks:
      - videolog

  # ----------------------------------------------------------
  # 5. LIVEKIT EGRESS
  # ----------------------------------------------------------
  egress:
    <<: *base
    image: livekit/egress:v1.8.4
    container_name: vl-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
    volumes:
      - ./egress/config.yaml:/etc/egress.yaml:ro
      - egress_tmp:/tmp/egress
    deploy:
      resources:
        limits:
          cpus: '4.0'
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - videolog
    ipc: host
    security_opt:               # requis par Chrome headless (remplace la valeur de base)
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    stop_grace_period: 120s     # laisse finir et finaliser les enregistrements en cours
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  egress-ctl:
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-egress-ctl:${TAG:-latest}
    build:
      context: ./egress
      dockerfile: Dockerfile
    container_name: vl-egress-ctl
    profiles:
      - tools
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
      RECORDING_MODE: ${RECORDING_MODE:-manual}
      RECORDING_MAX_DURATION_SECONDS: ${RECORDING_MAX_DURATION_SECONDS:-180}
    depends_on:
      - livekit
      - egress
    networks:
      - videolog

  # ----------------------------------------------------------
  # 5c. EGRESS WEBHOOK (appelé par LiveKit en interne, pas de port publié)
  # ----------------------------------------------------------
  egress-webhook:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-egress-webhook:${TAG:-latest}
    build:
      context: ./egress
      dockerfile: Dockerfile.webhook
    container_name: vl-egress-webhook
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      STOP_GRACE_DELAY: ${STOP_GRACE_DELAY:-10}
      RECORD_MIN_PARTICIPANTS: ${RECORD_MIN_PARTICIPANTS:-2}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
      RECORDING_MODE: ${RECORDING_MODE:-manual}
      RECORDING_MAX_DURATION_SECONDS: ${RECORDING_MAX_DURATION_SECONDS:-180}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 7. TELEMETRY AGENT
  # ----------------------------------------------------------
  telemetry-agent:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-telemetry-agent:${TAG:-latest}
    build:
      context: ./telemetry-agent
      dockerfile: Dockerfile
    container_name: vl-telemetry-agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      REDIS_URL: redis://redis:6379
      ROOM_NAME: ${VIDEOLOG_ROOM:-poc-room}
      ROOM_NAMES: ${VIDEOLOG_ROOMS:-poc-room}
      ALERT_HR_MAX: ${ALERT_HR_MAX:-185}
      ALERT_HR_REST: ${ALERT_HR_REST:-50}
      ALERT_SPEED_MAX: ${ALERT_SPEED_MAX:-40}
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 8. MONGO WRITER
  # ----------------------------------------------------------
  mongo-writer:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-mongo-writer:${TAG:-latest}
    build:
      context: ./mongo-writer
      dockerfile: Dockerfile
    container_name: vl-mongo-writer
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      BATCH_SIZE: "50"
      FLUSH_INTERVAL: ${TELEMETRY_INTERVAL:-0.5}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videolog
    stop_grace_period: 20s       # flush du dernier batch avant arrêt
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 9. DASHBOARD WEB
  # ----------------------------------------------------------
  dashboard:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-dashboard:${TAG:-latest}
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: vl-dashboard
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - dashboard-api
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m

  # ----------------------------------------------------------
  # 10. DASHBOARD API
  # ----------------------------------------------------------
  dashboard-api:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-dashboard-api:${TAG:-latest}
    build:
      context: ./mongo-writer
      dockerfile: Dockerfile.api
    container_name: vl-dashboard-api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase/firebase-service-account.json
      RECORDING_MODE: ${RECORDING_MODE:-manual}
      RECORDING_MAX_DURATION_SECONDS: ${RECORDING_MAX_DURATION_SECONDS:-180}
    volumes:
      - ${FIREBASE_SECRETS_DIR:-./secrets}:/run/secrets/firebase:ro
    depends_on:
      mongo:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 384m
