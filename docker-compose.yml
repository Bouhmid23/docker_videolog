# ============================================================
#  VIDEOLOG — Full Stack (version optimisée prod)
#  cp .env.example .env  → remplir les secrets
#  Démarrer : docker compose up -d
#  Monitoring : docker compose --profile monitoring up -d
# ============================================================

x-base: &base
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  videolog:
    driver: bridge

volumes:
  mongo_data:
  minio_data:
  redis_data:
  egress_tmp:
  grafana_data:
  prometheus_data:
  caddy_data:
  caddy_config:

services:

  # ----------------------------------------------------------
  # 0. CADDY — seul point d'entrée HTTP(S), TLS automatique
  # ----------------------------------------------------------
  caddy:
    <<: *base
    image: caddy:2.8-alpine
    container_name: vl-caddy
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DASHBOARD_AUTH_USER: ${DASHBOARD_AUTH_USER:-videolog}
      DASHBOARD_AUTH_HASH: ${DASHBOARD_AUTH_HASH:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - videolog
    depends_on:
      - dashboard
      - dashboard-api
      - livekit
      - minio
    deploy:
      resources:
        limits:
          memory: 128m

  # ----------------------------------------------------------
  # 1. LIVEKIT SERVER
  # ----------------------------------------------------------
  livekit:
    <<: *base
    image: livekit/livekit-server:v1.7.2
    container_name: vl-livekit
    ports:
      - "127.0.0.1:7880:7880"   # signalisation : via Caddy (wss://lk.DOMAIN)
      - "7881:7881"             # ICE/TCP fallback (public)
      - "7882:7882/udp"         # média WebRTC (public)
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:?}": "${LIVEKIT_API_SECRET:?}"
        logging:
          level: info
          pion_level: error
        development: false
        room:
          auto_create: true
          max_participants: 20
          empty_timeout: 30
        webhook:
          urls:
            - http://egress-webhook:8088/webhook/livekit
            - http://dashboard-api:8000/webhook/livekit
          api_key: "${LIVEKIT_API_KEY:?}"
    networks:
      - videolog
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  # ----------------------------------------------------------
  # 2. REDIS (réseau interne uniquement)
  # ----------------------------------------------------------
  redis:
    <<: *base
    image: redis:7.2-alpine
    container_name: vl-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save ""
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --aof-use-rdb-preamble no
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

  # ----------------------------------------------------------
  # 3. MONGODB (réseau interne uniquement)
  # ----------------------------------------------------------
  mongo:
    <<: *base
    image: mongo:7.0
    container_name: vl-mongo
    # cache WiredTiger plafonné, sinon Mongo vise ~50% de la RAM de l'hôte
    # et se fait OOM-kill par la limite de 512m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-writer/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-videolog}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER requis dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD requis dans .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER requis dans .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD requis dans .env}
    networks:
      - videolog
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ----------------------------------------------------------
  # 4. MINIO
  # ----------------------------------------------------------
  minio:
    <<: *base
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: vl-minio
    ports:
      - "127.0.0.1:9000:9000"   # API S3 : Nginx hôte (ou Caddy) en frontal
      - "127.0.0.1:9001:9001"   # console : accès via tunnel SSH uniquement
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    command: server /data --console-address ":9001"
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: vl-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/recordings &&
        mc mb --ignore-existing local/segments &&
        mc anonymous set none local/recordings &&
        mc anonymous set none local/segments &&
        echo 'Buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    networks:
      - videolog

  # ----------------------------------------------------------
  # 5. LIVEKIT EGRESS
  # ----------------------------------------------------------
  egress:
    <<: *base
    image: livekit/egress:v1.8.4
    container_name: vl-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
    volumes:
      - ./egress/config.yaml:/etc/egress.yaml:ro
      - egress_tmp:/tmp/egress
    deploy:
      resources:
        limits:
          cpus: '4.0'
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - videolog
    ipc: host
    security_opt:               # requis par Chrome headless (remplace la valeur de base)
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    stop_grace_period: 120s     # laisse finir et finaliser les enregistrements en cours
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  egress-ctl:
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-egress-ctl:${TAG:-latest}
    build:
      context: ./egress
      dockerfile: Dockerfile
    container_name: vl-egress-ctl
    profiles:
      - tools
    environment:
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
    depends_on:
      - livekit
      - egress
    networks:
      - videolog

  # ----------------------------------------------------------
  # 5c. EGRESS WEBHOOK (appelé par LiveKit en interne, pas de port publié)
  # ----------------------------------------------------------
  egress-webhook:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-egress-webhook:${TAG:-latest}
    build:
      context: ./egress
      dockerfile: Dockerfile.webhook
    container_name: vl-egress-webhook
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      STOP_GRACE_DELAY: ${STOP_GRACE_DELAY:-10}
      RECORD_MIN_PARTICIPANTS: ${RECORD_MIN_PARTICIPANTS:-2}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 7. TELEMETRY AGENT
  # ----------------------------------------------------------
  telemetry-agent:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-telemetry-agent:${TAG:-latest}
    build:
      context: ./telemetry-agent
      dockerfile: Dockerfile
    container_name: vl-telemetry-agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      REDIS_URL: redis://redis:6379
      ROOM_NAME: ${VIDEOLOG_ROOM:-poc-room}
      ROOM_NAMES: ${VIDEOLOG_ROOMS:-poc-room}
      ALERT_HR_MAX: ${ALERT_HR_MAX:-185}
      ALERT_HR_REST: ${ALERT_HR_REST:-50}
      ALERT_SPEED_MAX: ${ALERT_SPEED_MAX:-40}
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 8. MONGO WRITER
  # ----------------------------------------------------------
  mongo-writer:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-mongo-writer:${TAG:-latest}
    build:
      context: ./mongo-writer
      dockerfile: Dockerfile
    container_name: vl-mongo-writer
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      BATCH_SIZE: "50"
      FLUSH_INTERVAL: ${TELEMETRY_INTERVAL:-0.5}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - videolog
    stop_grace_period: 20s       # flush du dernier batch avant arrêt
    deploy:
      resources:
        limits:
          memory: 256m

  # ----------------------------------------------------------
  # 9. DASHBOARD WEB
  # ----------------------------------------------------------
  dashboard:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-dashboard:${TAG:-latest}
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: vl-dashboard
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - dashboard-api
    networks:
      - videolog
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m

  # ----------------------------------------------------------
  # 10. DASHBOARD API
  # ----------------------------------------------------------
  dashboard-api:
    <<: *base
    image: ${REGISTRY:-ghcr.io/bouhmid23}/videolog-dashboard-api:${TAG:-latest}
    build:
      context: ./mongo-writer
      dockerfile: Dockerfile.api
    container_name: vl-dashboard-api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/videolog?authSource=videolog
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?}
    depends_on:
      mongo:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 384m

  # ----------------------------------------------------------
  # 12-15. MONITORING (profil: monitoring) — accès via tunnel SSH
  # ----------------------------------------------------------
  prometheus:
    <<: *base
    image: prom/prometheus:v2.50.0
    container_name: vl-prometheus
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    <<: *base
    image: grafana/grafana:10.2.0
    container_name: vl-grafana
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/videolog-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/videolog-dashboard.json:/etc/grafana/dashboards/videolog-dashboard.json:ro
    networks:
      - videolog
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m

  redis-exporter:
    <<: *base
    image: oliver006/redis_exporter:v1.58.0
    container_name: vl-redis-exporter
    profiles:
      - monitoring
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 64m

  mongo-exporter:
    <<: *base
    image: percona/mongodb_exporter:0.40
    container_name: vl-mongo-exporter
    profiles:
      - monitoring
    command: --mongodb.uri=mongodb://${MONGO_ROOT_USER:?}:${MONGO_ROOT_PASSWORD:?}@mongo:27017/admin?authSource=admin --collect-all
    networks:
      - videolog
    deploy:
      resources:
        limits:
          memory: 64m
