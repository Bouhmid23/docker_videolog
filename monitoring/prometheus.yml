global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'dashboard-api'
    static_configs:
      - targets: ['dashboard-api:8000']
    metrics_path: /metrics

  - job_name: 'egress-webhook'
    static_configs:
      - targets: ['egress-webhook:8088']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo-exporter:9216']
